<!-- Supabase → Authentication → Email Templates → "Confirm signup"
     Subject: Confirm your Tiny Wins account 🌰
     Uses token_hash so the link works in any browser or device
     (important for people who sign up inside the TikTok app). -->
<div style="font-family:Nunito,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;background:#FFFDF8;border-radius:24px;color:#2F2A24;text-align:center">
  <div style="font-size:40px">🐿️</div>
  <h1 style="font-size:24px;margin:8px 0">Welcome to the treehouse!</h1>
  <p style="font-size:16px;line-height:1.5">Tap below to confirm your email and meet your Pip.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/onboarding"
       style="background:#397A69;color:#FFFDF8;text-decoration:none;font-weight:800;padding:14px 28px;border-radius:999px;display:inline-block">Confirm my email</a>
  </p>
  <p style="font-size:13px;color:#6E6558">Big dreams. Small steps. One acorn at a time.<br>Didn't sign up? You can ignore this email.</p>
</div>
