# Supabase CLI config for local development (`supabase start`).
# Hosted projects are configured in the Supabase dashboard instead (see README).
project_id = "tiny-wins"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[studio]
port = 54323

[inbucket]
# Local email viewer for auth emails: http://localhost:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false

[auth.email.template.confirmation]
subject = "Confirm your Tiny Wins account 🌰"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Tiny Wins password"
content_path = "./supabase/templates/recovery.html"
